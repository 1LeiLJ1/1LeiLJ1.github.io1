<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘寻宝大冒险</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }
        
        h1 {
            text-align: center;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ffcc00;
            background: linear-gradient(to right, #ffcc00, #ff9900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #cccccc;
        }
        
        .treasure-map {
            width: 100%;
            height: 200px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%238B4513"/><path d="M10,10 L90,10 L90,90 L10,90 Z" fill="none" stroke="%23D2B48C" stroke-width="2"/><circle cx="50" cy="50" r="5" fill="%23FFD700"/><path d="M30,30 L70,70 M70,30 L30,70" stroke="%23FFD700" stroke-width="2"/></svg>') center/cover no-repeat;
            border: 3px solid #8B4513;
            border-radius: 10px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            background: linear-gradient(to bottom, #ff9900, #cc6600);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            background: linear-gradient(to bottom, #ffaa00, #dd7700);
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .progress-container {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #ff9900, #ffcc00);
            border-radius: 5px;
            transition: width 0.5s;
        }
        
        .steps {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .step {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0.5;
            transition: all 0.5s;
            transform: translateX(-20px);
        }
        
        .step.active {
            opacity: 1;
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(0);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }
        
        .step.completed {
            opacity: 0.8;
            background: rgba(0, 255, 0, 0.1);
        }
        
        .step-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background: #444;
            flex-shrink: 0;
        }
        
        .step.active .step-icon {
            background: linear-gradient(135deg, #ff9900, #ffcc00);
            animation: pulse 1.5s infinite;
        }
        
        .step.completed .step-icon {
            background: linear-gradient(135deg, #00cc00, #66ff66);
        }
        
        .step-content {
            flex-grow: 1;
        }
        
        .step-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .step-description {
            color: #cccccc;
            font-size: 0.9rem;
        }
        
        .treasure-result {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 204, 0, 0.2);
            border-radius: 10px;
            display: none;
        }
        
        .treasure-result h2 {
            color: #ffcc00;
            margin-bottom: 10px;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes sparkle {
            0% { opacity: 0; transform: translateY(0) rotate(0); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-20px) rotate(180deg); }
        }
        
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffcc00;
            border-radius: 50%;
            animation: sparkle 1.5s infinite;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            button {
                padding: 10px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <h1>神秘寻宝大冒险</h1>
    <p class="subtitle">跟随线索，解开谜题，找到传说中的宝藏！</p>
    
    <div class="container">
        <div class="treasure-map" id="treasureMap">
            <!-- 动态添加火花效果 -->
        </div>
        
        <div class="controls">
            <button id="startBtn">开始寻宝</button>
            <button id="resetBtn" disabled>重新开始</button>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="steps" id="stepsContainer">
            <div class="step" id="step1">
                <div class="step-icon">1</div>
                <div class="step-content">
                    <div class="step-title">获取初始线索</div>
                    <div class="step-description">在古老的图书馆里寻找第一个线索...</div>
                </div>
            </div>
            
            <div class="step" id="step2">
                <div class="step-icon">2</div>
                <div class="step-content">
                    <div class="step-title">解码古代文字</div>
                    <div class="step-description">破译古代文字中的秘密信息...</div>
                </div>
            </div>
            
            <div class="step" id="step3">
                <div class="step-icon">3</div>
                <div class="step-content">
                    <div class="step-title">寻找神秘钥匙</div>
                    <div class="step-description">根据线索找到打开神庙大门的钥匙...</div>
                </div>
            </div>
            
            <div class="step" id="step4">
                <div class="step-icon">4</div>
                <div class="step-content">
                    <div class="step-title">探索古老神庙</div>
                    <div class="step-description">进入神庙深处，但要小心守卫...</div>
                </div>
            </div>
            
            <div class="step" id="step5">
                <div class="step-icon">5</div>
                <div class="step-content">
                    <div class="step-title">解开最终谜题</div>
                    <div class="step-description">破解宝箱上的古老机关...</div>
                </div>
            </div>
            
            <div class="step" id="step6">
                <div class="step-icon">6</div>
                <div class="step-content">
                    <div class="step-title">获得宝藏</div>
                    <div class="step-description">打开宝箱，获得传说中的宝藏！</div>
                </div>
            </div>
        </div>
        
        <div class="treasure-result" id="treasureResult">
            <h2 id="resultTitle">寻宝结果</h2>
            <p id="resultMessage"></p>
        </div>
    </div>

    <script>
        // 模拟宝藏地图API（扩展版）
        class TreasureMap {
            static getInitialClue() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve("在古老的图书馆里找到了第一个线索：一张泛黄的地图，上面标记着'月影峡谷'...");
                    }, 2000);
                });
            }
            
            static decodeAncientScript(clue) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        if (!clue) {
                            reject("没有线索可以解码!");
                        }
                        resolve("解码成功!地图指向一座隐藏在密林中的古老神庙，但需要一把特殊的钥匙才能进入...");
                    }, 2500);
                });
            }
            
            static findKey(location) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        const random = Math.random();
                        if (random < 0.3) {
                            reject("糟糕!在寻找钥匙时遇到了毒蛇，不得不撤退!");
                        } else {
                            resolve("在月影峡谷的瀑布后面找到了神秘的青铜钥匙!");
                        }
                    }, 3000);
                });
            }
            
            static searchTemple(location) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        const random = Math.random();
                        if (random < 0.4) {
                            reject("糟糕!遇到了神庙守卫，被迫撤离!");
                        } else {
                            resolve("成功进入神庙，在深处找到了一个刻有神秘符号的箱子...");
                        }
                    }, 3500);
                });
            }
            
            static solvePuzzle(box) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        const random = Math.random();
                        if (random < 0.2) {
                            reject("谜题太复杂了，无法解开宝箱的机关!");
                        } else {
                            resolve("成功解开谜题!宝箱的机关缓缓打开...");
                        }
                    }, 3000);
                });
            }
            
            static openTreasureBox() {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve("恭喜!你找到了传说中的宝藏——一颗闪耀着神秘光芒的'星辰之石'!");
                    }, 2000);
                });
            }
        }

        // 获取DOM元素
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressBar = document.getElementById('progressBar');
        const treasureResult = document.getElementById('treasureResult');
        const resultMessage = document.getElementById('resultMessage');
        const treasureMap = document.getElementById('treasureMap');
        
        // 步骤元素
        const steps = [
            document.getElementById('step1'),
            document.getElementById('step2'),
            document.getElementById('step3'),
            document.getElementById('step4'),
            document.getElementById('step5'),
            document.getElementById('step6')
        ];
        
        // 添加火花效果
        function addSparkles() {
            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                sparkle.style.width = Math.random() * 10 + 5 + 'px';
                sparkle.style.height = sparkle.style.width;
                treasureMap.appendChild(sparkle);
            }
        }
        
        // 更新进度条
        function updateProgress(step) {
            const progress = (step / steps.length) * 100;
            progressBar.style.width = progress + '%';
        }
        
        // 激活当前步骤
        function activateStep(stepIndex) {
            steps.forEach((step, index) => {
                step.classList.remove('active', 'completed');
                if (index < stepIndex) {
                    step.classList.add('completed');
                } else if (index === stepIndex) {
                    step.classList.add('active');
                }
            });
            
            updateProgress(stepIndex);
        }
        
        // 显示结果
        function showResult(message, isSuccess) {
            resultMessage.textContent = message;
            treasureResult.style.display = 'block';
            treasureResult.style.background = isSuccess 
                ? 'rgba(0, 255, 0, 0.2)' 
                : 'rgba(255, 0, 0, 0.2)';
            
            const resultTitle = document.getElementById('resultTitle');
            resultTitle.textContent = isSuccess ? '寻宝成功!' : '寻宝失败';
            resultTitle.style.color = isSuccess ? '#00ff00' : '#ff0000';
        }
        
        // 重置游戏
        function resetGame() {
            steps.forEach(step => {
                step.classList.remove('active', 'completed');
            });
            
            progressBar.style.width = '0%';
            treasureResult.style.display = 'none';
            startBtn.disabled = false;
            resetBtn.disabled = true;
            
            // 清除火花效果
            const sparkles = document.querySelectorAll('.sparkle');
            sparkles.forEach(sparkle => sparkle.remove());
        }
        
        // 使用async/await重写的寻宝过程
        async function findTreasureWithAsyncAwait() {
            try {
                startBtn.disabled = true;
                resetBtn.disabled = true;
                
                // 步骤1: 获取初始线索
                activateStep(0);
                const clue = await TreasureMap.getInitialClue();
                steps[0].querySelector('.step-description').textContent = clue;
                
                // 步骤2: 解码古代文字
                activateStep(1);
                const location = await TreasureMap.decodeAncientScript(clue);
                steps[1].querySelector('.step-description').textContent = location;
                
                // 步骤3: 寻找钥匙（新增情节）
                activateStep(2);
                const key = await TreasureMap.findKey(location);
                steps[2].querySelector('.step-description').textContent = key;
                
                // 步骤4: 探索神庙
                activateStep(3);
                const box = await TreasureMap.searchTemple(location);
                steps[3].querySelector('.step-description').textContent = box;
                
                // 步骤5: 解开谜题（新增情节）
                activateStep(4);
                const puzzle = await TreasureMap.solvePuzzle(box);
                steps[4].querySelector('.step-description').textContent = puzzle;
                
                // 步骤6: 获得宝藏
                activateStep(5);
                const treasure = await TreasureMap.openTreasureBox();
                steps[5].querySelector('.step-description').textContent = treasure;
                
                // 完成所有步骤
                updateProgress(steps.length);
                showResult(treasure, true);
                addSparkles();
            } catch (error) {
                showResult(`任务失败: ${error}`, false);
            } finally {
                resetBtn.disabled = false;
            }
        }
        
        // 事件监听
        startBtn.addEventListener('click', findTreasureWithAsyncAwait);
        resetBtn.addEventListener('click', resetGame);
        
        // 初始化
        addSparkles();
    </script>
</body>
</html>
